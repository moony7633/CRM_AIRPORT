<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#m{margin:0;height:100%}</style>
</head><body>
<div id="m"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('m').setView([55.97, 37.41], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const marks = {};
async function tick() {
  const s = await (await fetch('/api/state')).json();
  const put = (id, gps, color, label) => {
    if (!gps) return;
    const ll = [gps.lat, gps.lon];
    if (marks[id]) marks[id].setLatLng(ll);
    else marks[id] = L.circleMarker(ll, {radius: 6, color}).addTo(map).bindTooltip(label);
  };
  for (const t of s.techs)    put('t'+t.id, t.gps, '#3b82f6', t.name);
  for (const g of s.gse)      put('g'+g.id, g.gps, g.color || '#888', g.label);
  for (const a of s.aircraft) put('a'+a.id, a.gps, '#22c55e', a.flight);
  for (const r of s.active)   if (r.stand_gps) put('s'+r.id, r.stand_gps, '#f0b429', '#'+r.id+' '+r.stand);
}
tick(); setInterval(tick, 1000);
</script></body></html>
